<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>留言与预约</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="booking">
    <header>
      <div class="container nav">
        <a class="brand" href="/">汉绣非遗工作室</a>
        <nav class="nav-links">
          <a href="/">首页</a>
          <a href="/gallery.html">作品集</a>
          <a href="/shop.html">商城店铺</a>
          <a href="/knowledge.html">汉绣知识库</a>
          <a href="/about.html">关于我</a>
          <a class="active" href="/booking.html">留言预约</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="section">
        <h2>联系与预约</h2>
        <form id="inquiryForm">
          <label>姓名
            <input name="name" required />
          </label>
          <label>电话
            <input name="phone" required />
          </label>
          <label>预约类型
            <select name="type">
              <option value="商城购买">商城购买</option>
              <option value="定制预约">定制预约</option>
              <option value="到店咨询">到店咨询</option>
              <option value="合作留言">合作留言</option>
            </select>
          </label>
          <label>详细需求
            <textarea name="message" placeholder="请描述商品、规格、数量、预算或咨询需求"></textarea>
          </label>
          <button class="btn btn-primary" type="submit">提交留言</button>
          <p id="inquiryMsg" class="msg"></p>
        </form>
      </section>
    </main>

    <footer>
      <div class="container">© 2026 汉绣非遗工作室 | <a href="/admin.html">管理后台入口</a></div>
    </footer>

    <script src="/js/main.js"></script>
  </body>
</html>
