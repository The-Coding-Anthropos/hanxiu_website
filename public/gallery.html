<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汉绣作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="gallery">
    <header>
      <div class="container nav">
        <a class="brand" href="/">汉绣非遗工作室</a>
        <nav class="nav-links">
          <a href="/">首页</a>
          <a class="active" href="/gallery.html">作品集</a>
          <a href="/shop.html">商城店铺</a>
          <a href="/knowledge.html">汉绣知识库</a>
          <a href="/about.html">关于我</a>
          <a href="/booking.html">留言预约</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <section class="section">
        <h2>汉绣作品集</h2>
        <p class="meta">分类覆盖：花鸟、人物、屏风、挂画、文创衍生品。点击可查看细节特写与创作视频。</p>
        <div id="worksGrid" class="card-grid"></div>
      </section>

      <section class="section">
        <form id="inquiryForm">
          <h3>询价定制</h3>
          <label>姓名
            <input name="name" required />
          </label>
          <label>电话
            <input name="phone" required />
          </label>
          <label>咨询类型
            <select id="inquiryType" name="type">
              <option value="作品定制">作品定制</option>
              <option value="收藏咨询">收藏咨询</option>
            </select>
          </label>
          <label>需求描述
            <textarea id="inquiryMessage" name="message" placeholder="请描述尺寸、题材、用途、预算等"></textarea>
          </label>
          <button class="btn btn-primary" type="submit">提交询价</button>
          <p id="inquiryMsg" class="msg"></p>
        </form>
      </section>
    </main>
    <footer>
      <div class="container">© 2026 汉绣非遗工作室 | <a href="/admin.html">管理后台入口</a></div>
    </footer>
    <script src="/js/main.js"></script>
  </body>
</html>
