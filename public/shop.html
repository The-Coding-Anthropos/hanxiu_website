<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商城店铺</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="shop">
    <header>
      <div class="container nav">
        <a class="brand" href="/">汉绣非遗工作室</a>
        <nav class="nav-links">
          <a href="/">首页</a>
          <a href="/gallery.html">作品集</a>
          <a class="active" href="/shop.html">商城店铺</a>
          <a href="/knowledge.html">汉绣知识库</a>
          <a href="/about.html">关于我</a>
          <a href="/booking.html">留言预约</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="section">
        <h2>商城店铺</h2>
        <p class="meta">三大类目：成品挂画/摆件、手工定制礼品、汉绣工具包。选择规格与数量后，点击“联系管理员付款”即可提交采购意向。</p>
        <div id="productsGrid" class="card-grid"></div>
      </section>

      <section class="section two-col">
        <article class="card">
          <div class="card-body">
            <h3>采购说明</h3>
            <p class="meta">商品页面展示的是参考售价与运费标准。实际支付由管理员与您一对一确认。</p>
            <div class="highlight-strip">
              <p class="meta">流程：选择商品规格与数量 -> 联系管理员 -> 确认总价与付款方式 -> 安排发货</p>
            </div>
          </div>
        </article>

        <article class="card">
          <div class="card-body">
            <h3>联系付款入口</h3>
            <p class="meta">点击商品卡片内“联系管理员付款”后，会自动跳转到留言页并带入商品信息。</p>
            <p class="meta">也可以直接前往留言页手动填写需求。</p>
            <a class="btn btn-outline" href="/booking.html">前往留言预约</a>
          </div>
        </article>
      </section>
    </main>

    <footer>
      <div class="container">© 2026 汉绣非遗工作室 | <a href="/admin.html">管理后台入口</a></div>
    </footer>

    <script src="/js/main.js"></script>
  </body>
</html>
